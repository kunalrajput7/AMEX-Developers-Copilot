# Minimum acceptable scores. run_eval.py exits non-zero if any gold-tier metric
# falls below its threshold, which is what fails a CI build.
#
# ---------------------------------------------------------------------------
# SET FOR RUN-TO-RUN VARIANCE, NOT FROM A SINGLE GOOD RUN.
# ---------------------------------------------------------------------------
#
# Baseline over the 32-question gold set, judged by gpt-4.1 (2026-08-09):
#
#   metric                score    n    notes
#   context_recall        0.923    26
#   citation_recall       0.923    26
#   reciprocal_rank       0.743    26   most sensitive to query phrasing
#   faithfulness          0.969    26
#   answer_relevance      0.985    26
#   answer_correctness    0.965    26
#   refusal_correctness   1.000     6   all six declined correctly
#
#   passed 30/32 -- two retrieval misses, both real
#
# Earlier runs on the smaller 25-question set showed a spread of 0.04 to 0.08
# on every metric with identical code, and three questions changing verdict.
# Two things cause that, and neither is a regression:
#
#   1. The agent writes its own search queries, and model inference is not
#      bit-deterministic. The same question can be searched two different ways
#      on two runs, landing in different corners of the corpus.
#   2. Small samples amplify it. With 26 answerable questions one flip moves a
#      metric by 0.038; with only 6 refusal questions one flip moves it by
#      0.167. Growing the sets is the only thing that tightens these floors.
#
# Each floor therefore sits roughly two questions below the measured score. A
# gate that trips on a coin flip gets ignored within a week, and an ignored
# gate protects nothing.

gold:
  # Retrieval. Computed by comparing URLs -- no model reads them, but they
  # still depend on which chunks the agent chose to gather.
  context_recall: 0.85 # 0.923 measured; allows 4 misses in 26
  citation_recall: 0.80 # 0.923 measured
  reciprocal_rank: 0.62 # 0.743 measured; ranking degrades before recall does

  # Generation, scored by the independent judge. Carries the agent's variance
  # and the judge's own, so slightly looser.
  faithfulness: 0.85 # 0.969 measured; fabrication shows here first
  answer_relevance: 0.85 # 0.985 measured
  answer_correctness: 0.85 # 0.965 measured

  # Honesty: of the questions the corpus cannot answer, how many were declined
  # rather than answered anyway. Deliberately the loosest floor, purely because
  # n=6 -- one flip is 0.167, so anything tighter would fail on noise. This is
  # the number to tighten first as more refusal cases are added; the behaviour
  # it measures matters more than any other on this list.
  refusal_correctness: 0.66 # 1.000 measured; allows 2 of 6 to slip

# The synthetic tier is generated from the corpus, so its reference answers are
# a soft standard. Run for volume and trend; it does not gate the build.
synthetic: {}
